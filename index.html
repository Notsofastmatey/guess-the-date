<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guess the Date</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#0f1e33;--panel:#17304f;--ink:#f4ecd8;--muted:#a9b6c8;--gold:#e0b44c;--line:#3b5a80;--ok:#7cc47f}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(circle at 30% 15%,#1d3d68,#0f1e33 70%) fixed;color:var(--ink);font-family:Georgia,'Times New Roman',serif;min-height:100vh}
button,input{font:inherit;color:inherit}
.screen{padding:24px 16px;max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;gap:16px}
.center{justify-content:center;text-align:center}
.title{font-size:2.6rem;margin:0;color:var(--gold);letter-spacing:.02em}
.sub{color:var(--muted);margin:0}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:14px 22px;font-size:1.1rem;cursor:pointer}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#1a1405;font-weight:bold}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus{outline:4px solid var(--gold);outline-offset:4px}
.btn.primary:focus{outline-color:#fff}
.btn.small{padding:8px 14px;font-size:.95rem}
input{background:#0b1626;border:2px solid var(--line);border-radius:12px;padding:14px;font-size:1.2rem;width:100%}
input:focus{outline:none;border-color:var(--gold)}
label{color:var(--muted);font-size:.9rem;display:block;margin-bottom:6px;text-align:left}
.msg{color:#f2a38f;min-height:1.2em}
.tag{display:inline-block;border:1px solid var(--gold);color:var(--gold);border-radius:999px;padding:2px 12px;font-size:.85rem;letter-spacing:.05em;text-transform:uppercase}
.card{background:rgba(23,48,79,.75);border:1px solid var(--line);border-radius:16px;padding:18px}

/* Phone controller */
.yr{font-size:4.2rem;font-weight:bold;text-align:center;color:var(--gold);font-variant-numeric:tabular-nums;margin:4px 0}
input[type=range]{padding:0;height:44px;background:transparent;border:none;accent-color:var(--gold)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.steps .btn{padding:14px 0;font-size:1.2rem}
.big{font-size:1.4rem;padding:18px}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--c);vertical-align:middle;margin-right:8px}

/* TV */
body.tv .screen{max-width:none;padding:5vh 5vw;height:100vh;min-height:0;font-size:2.2vh;gap:3vh}
body.tv .title{font-size:9vh}
body.tv .sub{font-size:3vh}
body.tv .btn{font-size:2.8vh;padding:1.6vh 3vh;border-radius:1.6vh}
body.tv .btn:focus{transform:scale(1.05)}
body.tv .tag{font-size:2.2vh;padding:.4vh 2vh}
.lobby{display:grid;grid-template-columns:1fr 1fr;gap:5vw;flex:1;align-items:center}
.code{font-size:14vh;letter-spacing:.15em;color:var(--gold);font-weight:bold;line-height:1}
.qr{background:#fff;padding:1.5vh;border-radius:1.5vh;display:inline-block;margin-top:2vh}
.qr img,.qr canvas{display:block;width:24vh!important;height:24vh!important}
.players{display:flex;flex-wrap:wrap;gap:1.5vh}
.chip{display:flex;align-items:center;gap:1vh;background:var(--panel);border:2px solid var(--c);border-radius:999px;padding:1vh 2.4vh;font-size:3vh}
.chip.off{opacity:.45}
.chip .st{font-size:2.6vh;color:var(--muted)}
.chip.done .st{color:var(--ok)}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:3vh}
.question{font-size:7vh;line-height:1.15;margin:0;text-align:center;flex:1;display:flex;align-items:center;justify-content:center;padding:0 4vw}
.foot{display:flex;justify-content:space-between;align-items:center;gap:3vh}

/* Timeline */
.tl{position:relative;height:42vh;margin:0 4vw}
.axis{position:absolute;left:0;right:0;top:58%;height:.5vh;background:var(--line);border-radius:1vh}
.axis span{position:absolute;top:1.5vh;color:var(--muted);font-size:2.2vh;transform:translateX(-50%)}
.pin{position:absolute;bottom:42%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;opacity:0;animation:drop .5s ease-out forwards}
.pin .lab{background:var(--c);color:#111;border-radius:1vh;padding:.5vh 1.4vh;font-size:2.3vh;font-weight:bold;white-space:nowrap;text-align:center;line-height:1.15}
.pin .lab small{display:block;font-weight:normal;font-size:2vh}
.pin .stem{width:.4vh;background:var(--c);height:calc(2vh + var(--row) * 8.5vh)}
.answer{position:absolute;top:58%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;opacity:0;animation:rise .6s ease-out forwards}
.answer .stem{width:.6vh;height:4vh;background:var(--gold)}
.answer .lab{background:var(--gold);color:#1a1405;border-radius:1.2vh;padding:.6vh 2.4vh;font-size:5vh;font-weight:bold}
@keyframes drop{from{opacity:0;transform:translate(-50%,-4vh)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes rise{from{opacity:0;transform:translate(-50%,4vh) scale(.8)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
.late{opacity:0;animation:fade .5s ease-out forwards}
@keyframes fade{to{opacity:1}}
.fact{text-align:center;font-size:3vh;color:var(--muted);font-style:italic;margin:0}
.scores{display:flex;flex-wrap:wrap;gap:1.5vh;justify-content:center}
.scores .chip b{color:var(--gold)}
.board{display:flex;flex-direction:column;gap:1.4vh;max-width:70vh;margin:0 auto;width:100%}
.board .line{display:flex;align-items:center;gap:2vh;background:var(--panel);border-left:1vh solid var(--c);border-radius:1vh;padding:1.4vh 2.4vh;font-size:3.6vh}
.board .line .n{flex:1}
.board .line b{color:var(--gold)}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ---------- Question bank (c = category, q = prompt, a = year, f = fact shown on reveal) ---------- */
const QUESTIONS = [
  {c:'Invention',q:'The Wright brothers make the first powered aeroplane flight',a:1903,f:'The first flight at Kitty Hawk lasted about 12 seconds.'},
  {c:'Invention',q:'Alexander Graham Bell patents the telephone',a:1876,f:'The patent was granted in March 1876.'},
  {c:'Invention',q:'Alexander Fleming discovers penicillin',a:1928,f:'He noticed mould killing bacteria in a petri dish.'},
  {c:'Invention',q:'Tim Berners-Lee proposes the World Wide Web',a:1989,f:'He wrote the proposal while working at CERN.'},
  {c:'Invention',q:'The first iPhone goes on sale',a:2007,f:'It launched in the US that June.'},
  {c:'Invention',q:"Stephenson's Rocket wins the Rainhill Trials",a:1829,f:'It reached around 30 mph.'},
  {c:'Invention',q:'The Penny Black, the first adhesive postage stamp, is issued',a:1840,f:'It carried a portrait of the young Queen Victoria.'},
  {c:'Invention',q:'Edison tests a long-lasting carbon-filament light bulb',a:1879,f:'Joseph Swan was developing bulbs in England at the same time.'},
  {c:'Invention',q:'John Logie Baird demonstrates television in London',a:1926,f:'He showed it to members of the Royal Institution in Soho.'},
  {c:'Invention',q:'Sputnik 1, the first artificial satellite, is launched',a:1957,f:'It was launched by the Soviet Union.'},
  {c:'Invention',q:'Watson and Crick publish the double-helix structure of DNA',a:1953,f:"Their work relied on Rosalind Franklin's X-ray images."},
  {c:'Invention',q:'The Hubble Space Telescope is launched',a:1990,f:'Astronauts fixed its flawed mirror in 1993.'},
  {c:'Invention',q:"The world's first underground railway opens in London",a:1863,f:'It ran between Paddington and Farringdon.'},
  {c:'Invention',q:'The Channel Tunnel opens',a:1994,f:'It was opened by the Queen and President Mitterrand.'},
  {c:'Event',q:'The Battle of Hastings',a:1066,f:'William of Normandy defeated King Harold II.'},
  {c:'Event',q:'Magna Carta is sealed',a:1215,f:'King John sealed it at Runnymede.'},
  {c:'Event',q:'The Great Fire of London',a:1666,f:'It started in a bakery on Pudding Lane.'},
  {c:'Event',q:'The Battle of Trafalgar',a:1805,f:'Nelson was killed during the battle.'},
  {c:'Event',q:'The Battle of Waterloo',a:1815,f:'Wellington and Blücher defeated Napoleon.'},
  {c:'Event',q:'The Berlin Wall falls',a:1989,f:'The wall had divided the city since 1961.'},
  {c:'Event',q:'The Titanic sinks',a:1912,f:'It sank on its maiden voyage after hitting an iceberg.'},
  {c:'Event',q:'The Gunpowder Plot is foiled',a:1605,f:'Guy Fawkes was caught guarding the gunpowder.'},
  {c:'Event',q:'Columbus first reaches the Americas',a:1492,f:'He landed in the Bahamas that October.'},
  {c:'Event',q:'The Spanish Armada sails against England',a:1588,f:'The fleet was scattered by English ships and storms.'},
  {c:'Event',q:'England win the football World Cup',a:1966,f:'They beat West Germany 4–2 at Wembley.'},
  {c:'Event',q:'Some women gain the vote in UK elections for the first time',a:1918,f:'It applied to women over 30 who met property conditions.'},
  {c:'Event',q:'The NHS is founded',a:1948,f:'Aneurin Bevan launched it on 5 July.'},
  {c:'Event',q:'Decimal Day: Britain switches to decimal currency',a:1971,f:'The pound became 100 new pence on 15 February.'},
  {c:'Event',q:'The Great Exhibition opens in Hyde Park',a:1851,f:'It was held in the Crystal Palace.'},
  {c:'Event',q:'Humans first walk on the Moon',a:1969,f:'Apollo 11 carried Neil Armstrong and Buzz Aldrin.'},
  {c:'Event',q:'The first Harry Potter book is published',a:1997,f:'Bloomsbury published it in the UK.'},
  {c:'Birth',q:'William Shakespeare is born',a:1564,f:'He was born in Stratford-upon-Avon.'},
  {c:'Birth',q:'Queen Victoria is born',a:1819,f:'She went on to reign for over 63 years.'},
  {c:'Birth',q:'Charles Darwin is born',a:1809,f:'He shares a birthday with Abraham Lincoln.'},
  {c:'Birth',q:'Horatio Nelson is born',a:1758,f:'He was born in Burnham Thorpe, Norfolk.'},
  {c:'Birth',q:'Napoleon Bonaparte is born',a:1769,f:'He was born in Corsica.'},
  {c:'Birth',q:'Isambard Kingdom Brunel is born',a:1806,f:'He was born in Portsmouth.'},
  {c:'Birth',q:'Ada Lovelace is born',a:1815,f:'She was the daughter of the poet Lord Byron.'},
  {c:'Birth',q:'Albert Einstein is born',a:1879,f:'He was born in Ulm, Germany.'},
  {c:'Birth',q:'Winston Churchill is born',a:1874,f:'He was born at Blenheim Palace.'},
  {c:'Birth',q:'Marie Curie is born',a:1867,f:'She was born in Warsaw.'},
  {c:'Birth',q:'Queen Elizabeth II is born',a:1926,f:'She was born in Mayfair, London.'},
  {c:'Birth',q:'Jane Austen is born',a:1775,f:'She was born in Steventon, Hampshire.'},
  {c:'Birth',q:'Wolfgang Amadeus Mozart is born',a:1756,f:'He was born in Salzburg.'},
  {c:'Birth',q:'Florence Nightingale is born',a:1820,f:'She was named after the Italian city where she was born.'},
  {c:'Birth',q:'Alan Turing is born',a:1912,f:'He was born in Maida Vale, London.'},
  {c:'Birth',q:'Leonardo da Vinci is born',a:1452,f:'He was born in Vinci, near Florence.'}
];

const MIN_YEAR = 1000, MAX_YEAR = 2030, START_YEAR = 1900;
const PREFIX = 'gtd-sp-';
const LETTERS = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
const PALETTE = ['#e0b44c','#5fb3d9','#e2725b','#7cc47f','#c48ad8','#f08fb0','#6fd1c4','#d9d2a8'];
const BOT_NAMES = ['Nelson','Ada','Brunel','Austen','Darwin','Turing','Curie','Mozart'];

const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const params = new URLSearchParams(location.search);
function store(k, v){ try{ if(v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); }catch(e){ return null; } }
function shuffle(a){ a = a.slice(); for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* ---------- Remote-control navigation (arrow keys move between buttons) ---------- */
document.addEventListener('keydown', e => {
  const d = {37:'l',38:'u',39:'r',40:'d'}[e.keyCode];
  if(!d) return;
  const ae = document.activeElement;
  if(ae && ae.tagName === 'INPUT') return;
  const els = [...document.querySelectorAll('button:not([disabled])')].filter(b => b.offsetParent);
  if(!els.length) return;
  e.preventDefault();
  if(!els.includes(ae)){ els[0].focus(); return; }
  const r = ae.getBoundingClientRect(), cx = r.left + r.width/2, cy = r.top + r.height/2;
  let best = null, bs = Infinity;
  for(const b of els){
    if(b === ae) continue;
    const s = b.getBoundingClientRect(), dx = s.left + s.width/2 - cx, dy = s.top + s.height/2 - cy;
    const ok = d==='l' ? dx < -5 : d==='r' ? dx > 5 : d==='u' ? dy < -5 : dy > 5;
    if(!ok) continue;
    const score = (d==='l'||d==='r') ? Math.abs(dx) + Math.abs(dy)*2 : Math.abs(dy) + Math.abs(dx)*2;
    if(score < bs){ bs = score; best = b; }
  }
  if(best) best.focus();
});
function paint(html){
  const id = document.activeElement && document.activeElement.id;
  app.innerHTML = html;
  const keep = id && document.getElementById(id);
  if(keep && !keep.disabled) keep.focus();
  else { const b = document.querySelector('[data-auto]:not([disabled])') || document.querySelector('button:not([disabled])'); if(b) b.focus(); }
}

/* ---------- Home ---------- */
function home(){
  if(params.has('room')) return phoneJoin(params.get('room'));
  paint(`<div class="screen center">
    <h1 class="title">Guess the Date</h1>
    <p class="sub">Inventions, events and famous births. How close can you get?</p>
    <div class="row">
      <button class="btn primary" id="b-tv" data-auto onclick="startHost()">This is the TV</button>
      <button class="btn" id="b-ph" onclick="phoneJoin('')">Join on my phone</button>
    </div></div>`);
}

/* =================== HOST (TV) =================== */
let H = null;
function startHost(){
  document.body.classList.add('tv');
  H = {players:[], qs:[], i:-1, phase:'lobby', rounds:10, code:'', status:'Connecting…', token:0};
  openRoom();
}
function openRoom(){
  H.code = Array.from({length:4}, () => LETTERS[Math.floor(Math.random()*LETTERS.length)]).join('');
  H.status = 'Connecting…';
  H.peer = new Peer(PREFIX + H.code.toLowerCase());
  H.peer.on('open', () => { H.status = ''; render(); });
  H.peer.on('connection', c => {
    c.on('data', d => onHostData(c, d));
    c.on('close', () => { const p = H.players.find(p => p.conn === c); if(p){ p.online = false; render(); checkAll(); } });
  });
  H.peer.on('error', e => {
    if(e.type === 'unavailable-id'){ H.peer.destroy(); openRoom(); }
    else if(e.type !== 'peer-unavailable'){ H.status = 'Connection problem (' + e.type + ')'; render(); }
  });
  H.peer.on('disconnected', () => { try{ H.peer.reconnect(); }catch(e){} });
  render();
}
const joinURL = () => location.origin + location.pathname + '?room=' + H.code;
const active = () => H.players.filter(p => p.bot || p.online);
function send(p, m){ if(p.conn && p.conn.open) p.conn.send(m); }

function onHostData(c, d){
  if(d.t === 'join'){
    let name = String(d.name || '').trim().slice(0, 14) || 'Player';
    let p = H.players.find(p => p.name.toLowerCase() === name.toLowerCase());
    if(p && !p.bot && !p.online){ p.conn = c; p.online = true; }          // rejoin keeps score
    else {
      if(H.players.length >= 8){ c.send({t:'err', msg:'Sorry, the game is full (8 players).'}); return; }
      if(p){ let n = 2; while(H.players.find(q => q.name.toLowerCase() === (name + ' ' + n).toLowerCase())) n++; name = name + ' ' + n; }
      p = {name, score:0, conn:c, online:true, guess:null, last:null, color:PALETTE[H.players.length % 8]};
      H.players.push(p);
    }
    c.send({t:'hello', name:p.name, color:p.color});
    sendState(p);
    render();
  } else if(d.t === 'guess' && H.phase === 'question'){
    const p = H.players.find(p => p.conn === c);
    const y = Math.round(Number(d.year));
    if(!p || !isFinite(y) || p.guess !== null) return;
    p.guess = y; render(); checkAll();
  }
}
function sendState(p){
  if(H.phase === 'lobby') send(p, {t:'wait', msg:'You’re in! Waiting for the game to start…'});
  else if(H.phase === 'question'){ const q = H.qs[H.i]; send(p, {t:'q', n:H.i+1, total:H.qs.length, cat:q.c, text:q.q, locked:p.guess}); }
  else if(H.phase === 'reveal'){ const q = H.qs[H.i]; send(p, {t:'res', answer:q.a, fact:q.f, guess:p.last ? p.last.guess : null, pts:p.last ? p.last.pts : 0, bonus:p.last ? p.last.bonus : 0, total:p.score}); }
  else if(H.phase === 'end'){ const ranked = [...H.players].sort((a,b) => b.score - a.score); send(p, {t:'end', rank:ranked.indexOf(p)+1, of:ranked.length, score:p.score}); }
}
function broadcast(){ H.players.forEach(sendState); }

function addBot(){
  if(H.players.length >= 8) return;
  const used = H.players.map(p => p.name);
  const name = (BOT_NAMES.find(n => !used.includes(n + ' (test)')) || 'Bot') + ' (test)';
  H.players.push({name, score:0, bot:true, online:true, guess:null, last:null, color:PALETTE[H.players.length % 8]});
  render();
}
function clearBots(){ H.players = H.players.filter(p => !p.bot); H.players.forEach((p,i) => p.color = PALETTE[i % 8]); render(); }
function setRounds(n){ H.rounds = n; render(); }

function startGame(){
  H.qs = shuffle(QUESTIONS).slice(0, H.rounds);
  H.players.forEach(p => { p.score = 0; p.last = null; });
  H.i = -1; nextQ();
}
function nextQ(){
  H.i++;
  if(H.i >= H.qs.length){ H.phase = 'end'; broadcast(); render(); return; }
  H.phase = 'question'; H.token++;
  H.players.forEach(p => p.guess = null);
  const a = H.qs[H.i].a, tok = H.token;
  H.players.filter(p => p.bot).forEach(p => setTimeout(() => {
    if(H.token !== tok || H.phase !== 'question') return;
    p.guess = a + Math.round((Math.random() + Math.random() + Math.random() - 1.5) * 30);
    render(); checkAll();
  }, 1500 + Math.random()*4000));
  broadcast(); render();
}
function checkAll(){
  if(H.phase !== 'question') return;
  const ps = active();
  if(ps.length && ps.every(p => p.guess !== null)){ const tok = H.token; setTimeout(() => { if(H.token === tok && H.phase === 'question') reveal(); }, 900); }
}
const pointsFor = d => d === 0 ? 100 : d <= 2 ? 70 : d <= 5 ? 50 : d <= 10 ? 30 : d <= 25 ? 10 : 0;
function reveal(){
  if(H.phase !== 'question') return;
  const a = H.qs[H.i].a;
  const guessers = H.players.filter(p => p.guess !== null);
  const best = guessers.length ? Math.min(...guessers.map(p => Math.abs(p.guess - a))) : null;
  H.players.forEach(p => {
    if(p.guess === null){ p.last = {guess:null, pts:0, bonus:0}; return; }
    const diff = Math.abs(p.guess - a), pts = pointsFor(diff), bonus = (guessers.length > 1 && diff === best) ? 20 : 0;
    p.last = {guess:p.guess, diff, pts, bonus};
    p.score += pts + bonus;
  });
  H.phase = 'reveal'; H.token++;
  broadcast(); render();
}
function backToLobby(){ H.phase = 'lobby'; H.players.forEach(p => { p.score = 0; p.last = null; p.guess = null; }); broadcast(); render(); }

function chips(showStatus){
  return H.players.map(p => {
    const done = p.guess !== null;
    const st = showStatus ? `<span class="st">${done ? '✓ locked' : (p.bot || p.online ? 'thinking…' : 'offline')}</span>` : '';
    return `<div class="chip ${p.bot || p.online ? '' : 'off'} ${showStatus && done ? 'done' : ''}" style="--c:${p.color}"><span class="dot" style="--c:${p.color}"></span>${esc(p.name)}${st}</div>`;
  }).join('');
}

function render(){
  if(!H) return;
  if(H.phase === 'lobby'){
    const local = location.protocol === 'file:';
    paint(`<div class="screen">
      <h1 class="title">Guess the Date</h1>
      <div class="lobby">
        <div>
          <p class="sub">Scan to join, or open this page on your phone and enter:</p>
          <div class="code">${H.status ? '····' : H.code}</div>
          <p class="msg">${esc(H.status)}${local ? ' This page needs to be hosted online for phones to join.' : ''}</p>
          <div class="qr" id="qr"></div>
        </div>
        <div>
          <p class="sub">Players (${H.players.length}/8)</p>
          <div class="players" style="margin:2vh 0 4vh">${chips(false) || '<span class="sub">Nobody yet…</span>'}</div>
          <p class="sub">Rounds</p>
          <div class="row" style="justify-content:flex-start;margin:1.5vh 0 4vh">
            ${[5,10,15].map(n => `<button class="btn small ${H.rounds===n?'primary':''}" id="r${n}" onclick="setRounds(${n})">${n}</button>`).join('')}
          </div>
          <div class="row" style="justify-content:flex-start">
            <button class="btn primary" id="b-start" data-auto onclick="startGame()" ${active().length ? '' : 'disabled'}>Start game</button>
            <button class="btn" id="b-bot" onclick="addBot()">Add test player</button>
            ${H.players.some(p => p.bot) ? '<button class="btn" id="b-clr" onclick="clearBots()">Clear test players</button>' : ''}
          </div>
        </div>
      </div></div>`);
    if(!H.status && window.QRCode) new QRCode($('#qr'), {text:joinURL(), width:256, height:256, correctLevel:QRCode.CorrectLevel.M});
    else $('#qr').style.display = 'none';
  }
  else if(H.phase === 'question'){
    const q = H.qs[H.i];
    paint(`<div class="screen">
      <div class="top"><span>Round ${H.i+1} of ${H.qs.length}</span><span class="tag">${esc(q.c)}</span><span>Room ${H.code}</span></div>
      <h2 class="question">${esc(q.q)}</h2>
      <div class="foot"><div class="players">${chips(true)}</div>
      <button class="btn" id="b-rev" data-auto onclick="reveal()" ${H.players.some(p => p.guess !== null) ? '' : 'disabled'}>Reveal now</button></div>
    </div>`);
  }
  else if(H.phase === 'reveal'){
    const q = H.qs[H.i];
    const g = H.players.filter(p => p.last && p.last.guess !== null).sort((a,b) => a.last.guess - b.last.guess);
    const ys = g.map(p => p.last.guess).concat(q.a);
    let lo = Math.min(...ys), hi = Math.max(...ys);
    const pad = Math.max(4, (hi - lo) * 0.08); lo -= pad; hi += pad;
    const pos = y => ((y - lo) / (hi - lo) * 100).toFixed(2);
    const t = g.length * 0.3 + 0.6;
    const pins = g.map((p,i) => `<div class="pin" style="left:${pos(p.last.guess)}%;--row:${i % 3};--c:${p.color};animation-delay:${i*0.3}s"><div class="lab">${esc(p.name)}<small>${p.last.guess}</small></div><div class="stem"></div></div>`).join('');
    const results = [...H.players].sort((a,b) => (b.last.pts + b.last.bonus) - (a.last.pts + a.last.bonus))
      .map(p => `<div class="chip" style="--c:${p.color}">${esc(p.name)} <b>+${p.last.pts + p.last.bonus}</b><span class="st">${p.last.guess === null ? 'no guess' : p.last.diff === 0 ? 'exact!' : p.last.diff + ' yrs off'}${p.last.bonus ? ' · closest' : ''}</span></div>`).join('');
    const last = H.i + 1 >= H.qs.length;
    paint(`<div class="screen">
      <div class="top"><span>Round ${H.i+1} of ${H.qs.length}</span><span class="tag">${esc(q.c)}</span><span>Room ${H.code}</span></div>
      <h2 class="question" style="flex:0;font-size:5vh">${esc(q.q)}</h2>
      <div class="tl"><div class="axis"><span style="left:0">${Math.round(lo)}</span><span style="left:100%">${Math.round(hi)}</span></div>
        ${pins}<div class="answer" style="left:${pos(q.a)}%;animation-delay:${t}s"><div class="stem"></div><div class="lab">${q.a}</div></div></div>
      <p class="fact late" style="animation-delay:${t+0.6}s">${esc(q.f)}</p>
      <div class="foot late" style="animation-delay:${t+0.9}s"><div class="scores">${results}</div>
      <button class="btn primary" id="b-next" data-auto onclick="nextQ()">${last ? 'Final scores' : 'Next question'}</button></div>
    </div>`);
  }
  else if(H.phase === 'end'){
    const ranked = [...H.players].sort((a,b) => b.score - a.score);
    paint(`<div class="screen center">
      <h1 class="title">Final scores</h1>
      <div class="board">${ranked.map((p,i) => `<div class="line" style="--c:${p.color}"><span>${i===0?'🏆':i+1}</span><span class="n">${esc(p.name)}</span><b>${p.score}</b></div>`).join('')}</div>
      <div class="row"><button class="btn primary" id="b-again" data-auto onclick="backToLobby()">Play again</button></div>
    </div>`);
  }
}

/* =================== PLAYER (phone) =================== */
let P = null;
function phoneJoin(code){
  P = {code:String(code || '').toUpperCase().slice(0,4), name:store('gtd-name') || '', phase:'join', year:START_YEAR, msg:''};
  renderPhone();
}
function joinFromForm(){
  const code = $('#code').value.trim().toUpperCase(), name = $('#name').value.trim().slice(0, 14);
  if(code.length !== 4 || !name){ P.msg = 'Enter the 4-letter code and your name.'; P.code = code; P.name = name; renderPhone(); return; }
  store('gtd-name', name);
  connect(code, name);
}
function connect(code, name){
  P.code = code; P.name = name; P.phase = 'connecting'; P.msg = ''; renderPhone();
  if(P.peer) try{ P.peer.destroy(); }catch(e){}
  P.peer = new Peer();
  P.peer.on('open', () => {
    const c = P.peer.connect(PREFIX + code.toLowerCase(), {reliable:true});
    P.conn = c;
    c.on('open', () => c.send({t:'join', name}));
    c.on('data', onPhoneData);
    c.on('close', () => { if(P.phase !== 'join'){ P.phase = 'lost'; renderPhone(); } });
  });
  P.peer.on('error', e => {
    P.phase = 'join';
    P.msg = e.type === 'peer-unavailable' ? 'No game found with that code.' : 'Connection problem (' + e.type + '). Try again.';
    renderPhone();
  });
}
function onPhoneData(d){
  if(d.t === 'hello'){ P.name = d.name; P.color = d.color; return; }
  if(d.t === 'wait'){ P.phase = 'wait'; P.msg = d.msg; }
  else if(d.t === 'q'){ P.phase = 'q'; P.q = d; P.locked = d.locked; if(P.locked == null) P.year = P.year || START_YEAR; try{ navigator.vibrate && navigator.vibrate(60); }catch(e){} }
  else if(d.t === 'res'){ P.phase = 'res'; P.res = d; }
  else if(d.t === 'end'){ P.phase = 'end'; P.end = d; }
  else if(d.t === 'err'){ P.phase = 'join'; P.msg = d.msg; }
  renderPhone();
}
function setYear(y){
  P.year = Math.max(MIN_YEAR, Math.min(MAX_YEAR, Math.round(y)));
  const el = $('#yr'); if(el) el.textContent = P.year;
  const sl = $('#sl'); if(sl && +sl.value !== P.year) sl.value = P.year;
}
function lockIn(){ if(P.locked != null) return; P.locked = P.year; P.conn && P.conn.open && P.conn.send({t:'guess', year:P.year}); renderPhone(); }

function renderPhone(){
  const who = P.color ? `<div class="sub"><span class="dot" style="--c:${P.color}"></span>${esc(P.name)}</div>` : '';
  let h = '';
  if(P.phase === 'join'){
    h = `<div class="screen center"><h1 class="title">Guess the Date</h1>
      <div><label for="code">Room code</label><input id="code" maxlength="4" autocapitalize="characters" autocomplete="off" value="${esc(P.code)}" style="text-transform:uppercase;letter-spacing:.3em;text-align:center;font-size:1.8rem"></div>
      <div><label for="name">Your name</label><input id="name" maxlength="14" autocomplete="nickname" value="${esc(P.name)}"></div>
      <p class="msg">${esc(P.msg)}</p>
      <button class="btn primary big" onclick="joinFromForm()">Join game</button></div>`;
  }
  else if(P.phase === 'connecting') h = `<div class="screen center"><p class="sub">Joining room ${esc(P.code)}…</p></div>`;
  else if(P.phase === 'lost') h = `<div class="screen center"><p class="sub">Lost connection to the TV.</p><button class="btn primary big" onclick="connect(P.code,P.name)">Rejoin</button></div>`;
  else if(P.phase === 'wait') h = `<div class="screen center">${who}<h2>${esc(P.msg)}</h2></div>`;
  else if(P.phase === 'q'){
    const q = P.q;
    if(P.locked != null) h = `<div class="screen center">${who}<p class="sub">Round ${q.n} of ${q.total}</p><p>${esc(q.text)}</p><div class="yr">${P.locked}</div><p class="sub">Locked in. Eyes on the TV!</p></div>`;
    else h = `<div class="screen">${who}<div class="card"><span class="tag">${esc(q.cat)}</span><p style="margin:10px 0 0;font-size:1.25rem">${esc(q.text)}</p></div>
      <div class="yr" id="yr">${P.year}</div>
      <input type="range" id="sl" min="${MIN_YEAR}" max="${MAX_YEAR}" step="1" value="${P.year}" oninput="setYear(+this.value)">
      <div class="steps"><button class="btn" onclick="setYear(P.year-10)">−10</button><button class="btn" onclick="setYear(P.year-1)">−1</button><button class="btn" onclick="setYear(P.year+1)">+1</button><button class="btn" onclick="setYear(P.year+10)">+10</button></div>
      <button class="btn primary big" onclick="lockIn()">Lock in</button></div>`;
  }
  else if(P.phase === 'res'){
    const r = P.res, off = r.guess === null ? 'You didn’t guess this time.' : r.guess === r.answer ? 'Exactly right!' : `You said ${r.guess}: ${Math.abs(r.guess - r.answer)} years off.`;
    h = `<div class="screen center">${who}<p class="sub">The answer was</p><div class="yr">${r.answer}</div><p>${off}</p>
      <h2 style="color:var(--gold);margin:0">+${r.pts + r.bonus}</h2>${r.bonus ? '<p class="sub">including +20 for closest</p>' : ''}<p class="sub">Total: ${r.total}</p></div>`;
  }
  else if(P.phase === 'end'){
    const e = P.end;
    h = `<div class="screen center">${who}<h1 class="title">${e.rank === 1 ? 'You won! 🏆' : 'You came ' + ordinal(e.rank)}</h1><p class="sub">${e.score} points · ${e.of} players</p><p class="sub">Waiting for the next game…</p></div>`;
  }
  app.innerHTML = h;
}
const ordinal = n => n + (['th','st','nd','rd'][(n % 100 - 20) % 10] || ['th','st','nd','rd'][n % 100] || 'th');

home();
</script>
