<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guess the Date</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=EB+Garamond:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --paper:#f1e4c6;--paper-deep:#dcc493;--edge:#b8955e;
  --ink:#3a2816;--muted:#7a6046;--line:#a9875a;
  --seal:#8e2b1d;--seal-dark:#6c1f14;--gold:#a87b14;--ok:#4d6b33;
  --card:rgba(255,248,230,.6);
  --display:'IM Fell English SC',Georgia,serif;--italic:'IM Fell English',Georgia,serif;--body:'EB Garamond',Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  color:var(--ink);font-family:var(--body);min-height:100vh;
  background:
    radial-gradient(ellipse at 50% 45%,rgba(255,250,235,.85) 0%,rgba(241,228,198,0) 60%),
    radial-gradient(ellipse at 50% 50%,var(--paper) 40%,var(--paper-deep) 85%,var(--edge) 110%) fixed;
  background-color:var(--paper);
}
button,input{font:inherit;color:inherit}
.screen{padding:24px 16px;max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;gap:16px}
.center{justify-content:center;text-align:center}
.title{font-family:var(--display);font-weight:normal;font-size:2.8rem;margin:0;color:var(--seal);letter-spacing:.02em;line-height:1}
.rule{height:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding-top:3px;width:60%;margin:6px auto}
.sub{color:var(--muted);margin:0;font-family:var(--italic);font-style:italic}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn{background:var(--card);border:2px solid var(--ink);border-radius:6px;padding:12px 22px;font-size:1.15rem;cursor:pointer;font-family:var(--display);letter-spacing:.04em}
.btn.primary{background:var(--seal);border-color:var(--seal-dark);color:#fbf1dc;box-shadow:inset 0 0 0 2px rgba(255,235,200,.25)}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus{outline:4px solid var(--gold);outline-offset:4px}
.btn.small{padding:6px 14px;font-size:1rem}
input{background:rgba(255,250,238,.9);border:2px solid var(--line);border-radius:6px;padding:14px;font-size:1.25rem;width:100%;font-family:var(--body)}
input:focus{outline:none;border-color:var(--seal)}
label{color:var(--muted);font-size:.95rem;display:block;margin-bottom:6px;text-align:left;font-family:var(--italic);font-style:italic}
.msg{color:var(--seal);min-height:1.2em}
.tag{display:inline-block;border:1px solid var(--seal);color:var(--seal);border-radius:3px;padding:2px 12px;font-size:.85rem;letter-spacing:.12em;text-transform:uppercase;font-family:var(--display)}
.card{background:var(--card);border:1px solid var(--line);outline:1px solid var(--line);outline-offset:3px;border-radius:2px;padding:16px;margin:4px}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--c);vertical-align:middle;margin-right:8px;border:1px solid rgba(0,0,0,.3)}
.timer{height:10px;background:rgba(58,40,22,.15);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.timer i{display:block;height:100%;background:var(--ink);width:100%}
.timer.low i{background:var(--seal)}

/* Phone */
.yr{font-family:var(--display);font-size:4.6rem;text-align:center;color:var(--seal);font-variant-numeric:tabular-nums;margin:0;line-height:1.1}
input[type=range]{padding:0;height:44px;background:transparent;border:none;accent-color:var(--seal)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.steps .btn{padding:14px 0;font-size:1.25rem}
.big{font-size:1.4rem;padding:16px}
.ptop{display:flex;align-items:center;gap:12px}
.ptop .timer{flex:1}
.pcd{font-family:var(--display);font-size:1.8rem;min-width:2ch;text-align:right;color:var(--ink)}
.pcd.low{color:var(--seal)}

/* TV */
body.tv .screen{max-width:none;padding:4vh 4vw;height:100vh;min-height:0;font-size:2.4vh;gap:2.4vh}
body.tv .title{font-size:10vh}
body.tv .sub{font-size:3.2vh}
body.tv .btn{font-size:3vh;padding:1.4vh 3.2vh;border-radius:.8vh}
body.tv .btn:focus{transform:scale(1.05)}
body.tv .tag{font-size:2.4vh;padding:.3vh 2vh}
body.tv .timer{height:1.4vh}
.lobby{display:grid;grid-template-columns:1fr 1fr;gap:5vw;flex:1;align-items:center}
.code{font-family:var(--display);font-size:15vh;letter-spacing:.15em;color:var(--seal);line-height:1}
.qr{background:#fffaf0;padding:1.5vh;border:1px solid var(--line);outline:1px solid var(--line);outline-offset:.6vh;display:inline-block;margin-top:2vh}
.qr img,.qr canvas{display:block;width:24vh!important;height:24vh!important}
.players{display:flex;flex-wrap:wrap;gap:1.5vh}
.chip{display:flex;align-items:center;gap:1vh;background:var(--card);border:2px solid var(--c);border-radius:999px;padding:.8vh 2.4vh;font-size:3vh}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:3vh;font-family:var(--italic);font-style:italic}
.tleft{font-family:var(--display);font-style:normal;font-size:6vh;color:var(--ink);font-variant-numeric:tabular-nums;min-width:9vh;text-align:right;line-height:1}
.tleft.low{color:var(--seal)}
.main{flex:1;display:flex;gap:3vw;min-height:0}
.left{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vh;min-width:0}
.question{font-family:var(--display);font-weight:normal;font-size:6.6vh;line-height:1.15;margin:0;text-align:center;padding:0 2vw}
.question.withimg{font-size:5.2vh}
.frame{background:#2b1d10;padding:1vh;border:.4vh solid var(--gold);box-shadow:0 0 0 .4vh #2b1d10,0 1.5vh 4vh rgba(58,40,22,.45)}
.frame img{display:block;max-height:40vh;max-width:52vw;filter:sepia(.25) contrast(1.02)}
.side{width:23vw;display:flex;flex-direction:column;gap:1.1vh;border-left:1px solid var(--line);padding-left:2vw}
.side h3{margin:0 0 .6vh;color:var(--muted);font-weight:normal;font-family:var(--display);font-size:3vh;letter-spacing:.1em}
.srow{display:flex;align-items:center;gap:1.2vh;background:var(--card);border-left:.8vh solid var(--c);padding:.9vh 1.6vh;font-size:2.9vh}
.srow .n{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .st{font-size:2.4vh;color:var(--muted);min-width:4vh;text-align:center}
.srow.done .st{color:var(--ok);font-weight:bold}
.srow.off{opacity:.45}
.srow .s{position:relative;font-weight:700;font-variant-numeric:tabular-nums;color:var(--seal);min-width:5vh;text-align:right}
.srow .s .new{position:absolute;right:0;top:0;background:#f6ecd4}

/* Timeline */
.tl{position:relative;height:44vh;width:100%}
.axis{position:absolute;left:0;right:0;top:62%;height:.45vh;background:var(--ink)}
.axis span{position:absolute;top:1.4vh;color:var(--muted);font-size:2.3vh;transform:translateX(-50%);font-family:var(--italic);font-style:italic}
.axis b{position:absolute;top:-.8vh;width:.3vh;height:2vh;background:var(--ink)}
.pin{position:absolute;bottom:38%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;opacity:0;animation:drop .5s ease-out forwards}
.pin .lab{background:var(--c);color:#fff8ea;border-radius:.6vh;padding:.4vh 1.4vh;font-size:2.4vh;font-weight:600;white-space:nowrap;text-align:center;line-height:1.15;box-shadow:0 .4vh 1vh rgba(58,40,22,.3)}
.pin .lab small{display:block;font-weight:normal;font-size:2.1vh}
.pin .stem{width:.35vh;background:var(--c);height:calc(1.6vh + var(--row) * 6.6vh)}
.answer{position:absolute;top:62%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;opacity:0;animation:rise .6s ease-out forwards}
.answer .stem{width:.5vh;height:3.5vh;background:var(--seal)}
.answer .lab{background:radial-gradient(circle at 35% 35%,#b03a28,var(--seal) 55%,var(--seal-dark));color:#fbf1dc;border-radius:50%;width:15vh;height:15vh;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:5vh;box-shadow:0 .6vh 1.6vh rgba(58,40,22,.45),inset 0 0 0 .6vh rgba(0,0,0,.12)}
@keyframes drop{from{opacity:0;transform:translate(-50%,-4vh)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes rise{from{opacity:0;transform:translate(-50%,4vh) scale(.6) rotate(-12deg)}to{opacity:1;transform:translate(-50%,0) scale(1) rotate(0)}}
.late{opacity:0;animation:fade .5s ease-out forwards}
@keyframes fade{to{opacity:1}}
.fact{text-align:center;font-size:3.6vh;margin:0;font-family:var(--italic);font-style:italic;max-width:60vw}
.revq{font-family:var(--display);font-size:4.2vh;margin:0;text-align:center;color:var(--muted)}
.board{display:flex;flex-direction:column;gap:1.4vh;max-width:80vh;margin:0 auto;width:100%}
.board .line{display:flex;align-items:center;gap:2vh;background:var(--card);border-left:1vh solid var(--c);padding:1.4vh 2.4vh;font-size:3.8vh}
.board .line .n{flex:1}
.board .line b{color:var(--seal)}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ---------- Question bank ----------
   c = category, q = prompt, a = year, f = fact shown on reveal,
   w = (optional) Wikipedia article whose lead picture is shown on the TV */
const QUESTIONS = [
  // Oddities
  {c:"Oddity",q:"The Australian army goes to war against emus — and loses",a:1932,f:"Machine guns proved no match for around 20,000 emus.",w:"Emu War"},
  {c:"Oddity",q:"A giant wave of molasses floods the streets of Boston",a:1919,f:"The sticky wave was said to move at around 35 mph.",w:"Great Molasses Flood"},
  {c:"Oddity",q:"A huge vat bursts and floods a London street with beer",a:1814,f:"Over a million litres of beer swept through St Giles.",w:"London Beer Flood"},
  {c:"Oddity",q:"Hundreds of people in Strasbourg start dancing uncontrollably for weeks",a:1518,f:"Nobody is sure why; theories range from stress to mouldy rye bread.",w:"Dancing plague of 1518"},
  {c:"Oddity",q:"Dutch tulip bulbs sell for the price of a house — then the market crashes",a:1637,f:"Tulip mania is often called the first speculative bubble.",w:"Tulip mania"},
  {c:"Oddity",q:"Charles Osborne starts hiccuping — and doesn’t stop for 68 years",a:1922,f:"He hiccuped an estimated 430 million times."},
  {c:"Oddity",q:"BBC Panorama shows Swiss farmers harvesting spaghetti from trees",a:1957,f:"It was an April Fool, and viewers rang in asking how to grow their own.",w:"Spaghetti-tree hoax"},
  {c:"Oddity",q:"Two cousins photograph “fairies” in Cottingley — and fool Arthur Conan Doyle",a:1917,f:"In the 1980s they admitted the fairies were paper cut-outs."},
  {c:"Oddity",q:"The famous “surgeon’s photo” of the Loch Ness Monster is taken",a:1934,f:"The “monster” was a toy submarine with a model head stuck on."},
  {c:"Oddity",q:"“Piltdown Man”, the supposed missing link, is unveiled",a:1912,f:"It was a hoax: a human skull with an orangutan’s jaw. It was exposed in 1953.",w:"Piltdown Man"},
  {c:"Oddity",q:"Britain and Zanzibar fight the shortest war in history",a:1896,f:"It was over in less than an hour.",w:"Anglo-Zanzibar War"},
  {c:"Oddity",q:"Britain goes to war with Spain over a sea captain’s ear",a:1739,f:"Robert Jenkins’ ear had been cut off by Spanish coastguards eight years earlier.",w:"War of Jenkins' Ear"},
  {c:"Oddity",q:"Britain and the USA nearly go to war after a farmer shoots a pig",a:1859,f:"The “Pig War” had only one casualty: the pig.",w:"Pig War (1859)"},
  {c:"Oddity",q:"An American businessman buys London Bridge and moves it to Arizona",a:1968,f:"It was rebuilt stone by stone in Lake Havasu City.",w:"London Bridge (Lake Havasu City)"},
  {c:"Oddity",q:"A man buys Stonehenge at auction as a present for his wife",a:1915,f:"Cecil Chubb paid £6,600, then gave it to the nation three years later.",w:"Stonehenge"},
  {c:"Oddity",q:"The last frost fair on the frozen Thames — an elephant is led across the ice",a:1814,f:"A new London Bridge let the river flow faster, so it stopped freezing over.",w:"River Thames frost fairs"},
  {c:"Oddity",q:"Medium Helen Duncan is jailed under the Witchcraft Act",a:1944,f:"The Witchcraft Act wasn’t repealed until 1951."},
  {c:"Oddity",q:"Parliament bans Christmas celebrations in England",a:1647,f:"Christmas stayed officially banned until the Restoration in 1660."},
  {c:"Oddity",q:"Britain skips 11 days to switch to the Gregorian calendar",a:1752,f:"2 September was followed straight away by 14 September."},
  {c:"Oddity",q:"The Duke of Wellington fights a duel — while he is Prime Minister",a:1829,f:"Nobody was hurt; his opponent fired into the air.",w:"Arthur Wellesley, 1st Duke of Wellington"},
  {c:"Oddity",q:"The last fatal duel is fought in England",a:1852,f:"It was between two French exiles, at Englefield Green in Surrey."},
  {c:"Oddity",q:"The inventor of the Pringles tube is buried in one",a:2008,f:"Fredric Baur’s family put some of his ashes in a Pringles can."},
  {c:"Oddity",q:"A 63-year-old teacher becomes the first person to go over Niagara Falls in a barrel",a:1901,f:"Annie Edson Taylor survived, but never made the fortune she hoped for.",w:"Annie Edson Taylor"},
  {c:"Oddity",q:"A sheep, a duck and a rooster become the first hot-air balloon passengers",a:1783,f:"They flew at Versailles in front of Louis XVI and Marie Antoinette.",w:"Aerostat Réveillon"},
  {c:"Oddity",q:"Cambridge scientists point a camera at their coffee pot so they never find it empty",a:1991,f:"The Trojan Room coffee pot later became the world’s first webcam on the web.",w:"Trojan Room coffee pot"},
  {c:"Oddity",q:"Harrods installs its first escalator — and offers nervous riders brandy",a:1898,f:"Staff waited at the top with brandy and smelling salts.",w:"Harrods"},

  // Britain
  {c:"Britain",q:"Walter Arnold gets the world’s first speeding ticket — for doing 8 mph",a:1896,f:"The limit was 2 mph, and he was chased down by a policeman on a bicycle."},
  {c:"Britain",q:"The world’s first traffic light goes up in Westminster — then explodes",a:1868,f:"It was gas-lit; the explosion came a few weeks later."},
  {c:"Britain",q:"A law says cars must be led by a man walking with a red flag",a:1865,f:"The “Red Flag Act” also limited them to 2 mph in towns."},
  {c:"Britain",q:"The world’s first cash machine opens, in Enfield",a:1967,f:"The first person to use it was the actor Reg Varney."},
  {c:"Britain",q:"Britain’s first motorway opens: the 8-mile Preston bypass",a:1958,f:"It is now part of the M6."},
  {c:"Britain",q:"Driving tests become compulsory in Britain",a:1935,f:"Until then you could drive without passing any test at all."},
  {c:"Britain",q:"Britain launches 999, the world’s first emergency phone number",a:1937,f:"It followed a fire where neighbours couldn’t get through to the fire brigade."},
  {c:"Britain",q:"The Metropolitan Police is founded",a:1829,f:"Officers were nicknamed “Bobbies” after Home Secretary Robert Peel."},
  {c:"Britain",q:"Britain’s first roadside post boxes appear — in Jersey",a:1852,f:"They were suggested by the novelist Anthony Trollope, then a Post Office surveyor.",w:"Pillar box"},
  {c:"Britain",q:"England introduces a tax on windows",a:1696,f:"Some householders bricked up windows to pay less."},
  {c:"Britain",q:"Income tax is introduced — supposedly as a temporary measure",a:1799,f:"William Pitt brought it in to pay for the wars with France."},
  {c:"Britain",q:"British Summer Time is introduced and the clocks go forward",a:1916,f:"It began during the First World War to save fuel."},
  {c:"Britain",q:"The royal clocks at Sandringham, kept half an hour fast, are finally put right",a:1936,f:"Edward VII had set them fast to get more daylight for shooting."},
  {c:"Britain",q:"Thomas Cook runs his first excursion — a train trip to a temperance meeting",a:1841,f:"It ran from Leicester to Loughborough."},
  {c:"Britain",q:"Billy Butlin opens his first holiday camp, in Skegness",a:1936,f:"The famous Redcoats were there from the very first season."},
  {c:"Britain",q:"The first Guinness Book of Records is published",a:1955,f:"It began as a way to settle pub arguments."},
  {c:"Britain",q:"Big Ben rings out over Westminster for the first time",a:1859,f:"Big Ben is the bell, not the tower.",w:"Big Ben"},
  {c:"Britain",q:"Sweet rationing finally ends in Britain",a:1953,f:"It had begun in 1942, during the war."},
  {c:"Britain",q:"The first zebra-striped crossings appear on British roads",a:1951,f:"Belisha beacons had marked crossings since 1934; the stripes came later."},
  {c:"Britain",q:"A 70 mph speed limit is introduced on motorways",a:1965,f:"Before this, there was no speed limit on motorways at all."},
  {c:"Britain",q:"Wearing a front seatbelt becomes law in Britain",a:1983,f:"New cars had been fitted with them since the 1960s."},
  {c:"Britain",q:"Greenwich Mean Time becomes the legal time across Britain",a:1880,f:"Before the railways, towns kept their own local time."},
  {c:"Britain",q:"Britain switches to decimal currency on “Decimal Day”",a:1971,f:"The pound became 100 new pence on 15 February."},
  {c:"Britain",q:"The NHS is founded",a:1948,f:"Aneurin Bevan launched it on 5 July."},
  {c:"Britain",q:"Some women get the vote in UK elections for the first time",a:1918,f:"It applied to women over 30 who met property conditions."},
  {c:"Britain",q:"The Great Stink: the Thames smells so bad Parliament considers moving out",a:1858,f:"It led Joseph Bazalgette to build London’s sewers.",w:"Great Stink"},
  {c:"Britain",q:"The Great Storm hits southern England, the night after a forecaster says not to worry",a:1987,f:"Around 15 million trees came down."},

  // Food and drink
  {c:"Food",q:"Sliced bread goes on sale for the first time",a:1928,f:"It was first sold in Chillicothe, Missouri."},
  {c:"Food",q:"Fry’s of Bristol make the first solid chocolate bar",a:1847,f:"Until then, chocolate was mostly something you drank."},
  {c:"Food",q:"Marmite is first made, from brewery leftovers",a:1902,f:"The factory was in Burton upon Trent, the home of British brewing."},
  {c:"Food",q:"Coca-Cola is invented — and sold as a medicine",a:1886,f:"It was created by pharmacist John Pemberton in Atlanta."},
  {c:"Food",q:"Jelly Babies first appear, sold as “Peace Babies”",a:1918,f:"The name celebrated the end of the First World War."},
  {c:"Food",q:"The first McDonald’s in Britain opens, in Woolwich",a:1974,f:"It was the company’s 3,000th restaurant."},
  {c:"Food",q:"Fish fingers go on sale in Britain — after nearly being called “Herring Savouries”",a:1955,f:"Another name considered was “Cod Pieces”."},
  {c:"Food",q:"The KitKat goes on sale",a:1935,f:"It was first called Rowntree’s Chocolate Crisp."},
  {c:"Food",q:"England’s first coffee house opens, in Oxford",a:1650,f:"Coffee houses were nicknamed “penny universities”."},
  {c:"Food",q:"Pizza Margherita is supposedly named after Italy’s queen",a:1889,f:"Its tomato, mozzarella and basil were said to match the Italian flag."},
  {c:"Food",q:"A New York tea merchant accidentally invents the tea bag",a:1908,f:"He sent samples in silk bags, and customers brewed them bag and all."},
  {c:"Food",q:"Spam is launched",a:1937,f:"Millions of tins fed Allied troops in the Second World War."},
  {c:"Food",q:"An engineer discovers microwave cooking when a chocolate bar melts in his pocket",a:1945,f:"The first microwave ovens were nearly 6 feet tall."},

  // Games and toys
  {c:"Games",q:"Lizzie Magie patents The Landlord’s Game, the ancestor of Monopoly",a:1904,f:"It was meant to show how landlords grow rich at tenants’ expense."},
  {c:"Games",q:"Monopoly goes on sale from Parker Brothers",a:1935,f:"Parker Brothers had turned it down the year before."},
  {c:"Games",q:"The first crossword puzzle is printed",a:1913,f:"It appeared in the New York World, and it was diamond-shaped."},
  {c:"Games",q:"Two Canadian journalists invent Trivial Pursuit",a:1979,f:"They had the idea after finding pieces missing from their Scrabble set."},
  {c:"Games",q:"Bubble wrap is invented — as textured wallpaper",a:1957,f:"It flopped as wallpaper, then found its calling in packaging.",w:"Bubble wrap"},
  {c:"Games",q:"Play-Doh goes on sale as a toy, after starting life as wallpaper cleaner",a:1956,f:"Its makers noticed nursery children were modelling with it."},
  {c:"Games",q:"The Slinky goes on sale",a:1945,f:"Its inventor got the idea when a spring fell off a shelf and kept going.",w:"Slinky"},
  {c:"Games",q:"Velcro is patented, inspired by burrs stuck to a dog’s fur",a:1955,f:"Its name comes from the French velours and crochet.",w:"Velcro"},
  {c:"Games",q:"Post-it Notes go on sale",a:1980,f:"The glue was a failed attempt at a super-strong adhesive."},
  {c:"Games",q:"The Rubik’s Cube is invented",a:1974,f:"It took its inventor about a month to solve it himself.",w:"Rubik's Cube"},

  {c:"Games",q:"Tetris is created by a programmer in the Soviet Union",a:1984,f:"Alexey Pajitnov didn’t earn royalties from it for years."},

  {c:"Games",q:"Mario first appears in a video game, under the name “Jumpman”",a:1981,f:"He was a carpenter, battling Donkey Kong."},
  {c:"Games",q:"Nintendo is founded — to make playing cards",a:1889,f:"It made cards for over 70 years before turning to toys and games."},

  // Sport
  {c:"Sport",q:"England play Scotland in the world’s first international football match",a:1872,f:"It finished 0–0."},
  {c:"Sport",q:"The first Wimbledon Championships are held",a:1877,f:"Only men played, and spectators paid a shilling."},
  {c:"Sport",q:"The marathon becomes 26.2 miles so the race can start at Windsor Castle",a:1908,f:"It was for the London Olympics."},
  {c:"Sport",q:"Tug of war is an Olympic event for the last time",a:1920,f:"Britain won gold with a team of City of London policemen."},
  {c:"Sport",q:"The very first parkrun takes place, in Bushy Park",a:2004,f:"Just 13 runners took part."},
  {c:"Sport",q:"The first London Marathon is run",a:1981,f:"The two leading men crossed the line holding hands."},
  {c:"Sport",q:"Matthew Webb becomes the first person to swim the English Channel",a:1875,f:"It took him nearly 22 hours.",w:"Matthew Webb"},
  {c:"Sport",q:"William Webb Ellis supposedly picks up the ball and invents rugby",a:1823,f:"Historians think the story is probably a myth."},
  {c:"Sport",q:"England win the football World Cup",a:1966,f:"They beat West Germany 4–2 at Wembley."},

const ROUND_MS = 10000, GRACE_MS = 1200;
const MIN_YEAR = 1000, MAX_YEAR = 2030, START_YEAR = 1900;
const PREFIX = 'gtd-sp-';
const LETTERS = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
const PALETTE = ['#8e2b1d','#2f5d7c','#4d6b33','#7a4a8c','#a87b14','#a0522d','#2e7d7a','#5a4a3a'];
const BOT_NAMES = ['Nelson','Ada','Brunel','Austen','Darwin','Turing','Curie','Mozart'];
const WIKI = 'https://en.wikipedia.org/api/rest_v1/page/summary/';

const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const params = new URLSearchParams(location.search);
function store(k, v){ try{ if(v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); }catch(e){ return null; } }
function shuffle(a){ a = a.slice(); for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* ---------- Remote-control navigation (arrow keys move between buttons) ---------- */
document.addEventListener('keydown', e => {
  const d = {37:'l',38:'u',39:'r',40:'d'}[e.keyCode];
  if(!d) return;
  const ae = document.activeElement;
  if(ae && ae.tagName === 'INPUT') return;
  const els = [...document.querySelectorAll('button:not([disabled])')].filter(b => b.offsetParent);
  if(!els.length) return;
  e.preventDefault();
  if(!els.includes(ae)){ els[0].focus(); return; }
  const r = ae.getBoundingClientRect(), cx = r.left + r.width/2, cy = r.top + r.height/2;
  let best = null, bs = Infinity;
  for(const b of els){
    if(b === ae) continue;
    const s = b.getBoundingClientRect(), dx = s.left + s.width/2 - cx, dy = s.top + s.height/2 - cy;
    const ok = d==='l' ? dx < -5 : d==='r' ? dx > 5 : d==='u' ? dy < -5 : dy > 5;
    if(!ok) continue;
    const score = (d==='l'||d==='r') ? Math.abs(dx) + Math.abs(dy)*2 : Math.abs(dy) + Math.abs(dx)*2;
    if(score < bs){ bs = score; best = b; }
  }
  if(best) best.focus();
});
function paint(html){
  const id = document.activeElement && document.activeElement.id;
  app.innerHTML = html;
  const keep = id && document.getElementById(id);
  if(keep && !keep.disabled) keep.focus();
  else { const b = document.querySelector('[data-auto]:not([disabled])') || document.querySelector('button:not([disabled])'); if(b) b.focus(); }
}

/* =================== HOST (TV) =================== */
let H = null;
function startHost(){
  document.body.classList.add('tv');
  H = {players:[], qs:[], i:-1, phase:'lobby', rounds:10, code:'', status:'Connecting…', token:0};
  openRoom();
}
function openRoom(){
  H.code = Array.from({length:4}, () => LETTERS[Math.floor(Math.random()*LETTERS.length)]).join('');
  H.status = 'Connecting…';
  H.peer = new Peer(PREFIX + H.code.toLowerCase());
  H.peer.on('open', () => { H.status = ''; render(); });
  H.peer.on('connection', c => {
    c.on('data', d => onHostData(c, d));
    c.on('close', () => { const p = H.players.find(p => p.conn === c); if(p){ p.online = false; render(); checkAll(); } });
  });
  H.peer.on('error', e => {
    if(e.type === 'unavailable-id'){ H.peer.destroy(); openRoom(); }
    else if(e.type !== 'peer-unavailable'){ H.status = 'Connection problem (' + e.type + ')'; render(); }
  });
  H.peer.on('disconnected', () => { try{ H.peer.reconnect(); }catch(e){} });
  render();
}
const joinURL = () => location.origin + location.pathname + '?room=' + H.code;
const active = () => H.players.filter(p => p.bot || p.online);
function send(p, m){ if(p.conn && p.conn.open) p.conn.send(m); }

function onHostData(c, d){
  if(d.t === 'join'){
    let name = String(d.name || '').trim().slice(0, 14) || 'Player';
    let p = H.players.find(p => p.name.toLowerCase() === name.toLowerCase());
    if(p && !p.bot && !p.online){ p.conn = c; p.online = true; }          // rejoin keeps score
    else {
      if(H.players.length >= 8){ c.send({t:'err', msg:'Sorry, the game is full (8 players).'}); return; }
      if(p){ let n = 2; while(H.players.find(q => q.name.toLowerCase() === (name + ' ' + n).toLowerCase())) n++; name = name + ' ' + n; }
      p = {name, score:0, conn:c, online:true, guess:null, last:null, color:PALETTE[H.players.length % 8]};
      H.players.push(p);
    }
    c.send({t:'hello', name:p.name, color:p.color});
    sendState(p);
    render();
  } else if(d.t === 'guess' && H.phase === 'question'){
    const p = H.players.find(p => p.conn === c);
    const y = Math.round(Number(d.year));
    if(!p || !isFinite(y) || p.guess !== null) return;
    p.guess = y; render(); checkAll();
  }
}
function sendState(p){
  if(H.phase === 'lobby') send(p, {t:'wait', msg:'You’re in! Waiting for the game to start…'});
  else if(H.phase === 'question'){ const q = H.qs[H.i]; send(p, {t:'q', n:H.i+1, total:H.qs.length, cat:q.c, text:q.q, locked:p.guess, ms:Math.max(0, H.deadline - Date.now())}); }
  else if(H.phase === 'reveal'){ const q = H.qs[H.i]; send(p, {t:'res', answer:q.a, fact:q.f, guess:p.last ? p.last.guess : null, pts:p.last ? p.last.pts : 0, bonus:p.last ? p.last.bonus : 0, total:p.score}); }
  else if(H.phase === 'end'){ const ranked = [...H.players].sort((a,b) => b.score - a.score); send(p, {t:'end', rank:ranked.indexOf(p)+1, of:ranked.length, score:p.score}); }
}
function broadcast(){ H.players.forEach(sendState); }

function addBot(){
  if(H.players.length >= 8) return;
  const used = H.players.map(p => p.name);
  const name = (BOT_NAMES.find(n => !used.includes(n + ' (test)')) || 'Bot') + ' (test)';
  H.players.push({name, score:0, bot:true, online:true, guess:null, last:null, color:PALETTE[H.players.length % 8]});
  render();
}
function clearBots(){ H.players = H.players.filter(p => !p.bot); H.players.forEach((p,i) => p.color = PALETTE[i % 8]); render(); }
function setRounds(n){ H.rounds = n; render(); }

/* Pictures: fetched from Wikipedia when a game starts, so they're ready when the question appears */
function loadImage(q){
  if(!q.w || q.img !== undefined) return;
  q.img = null;
  fetch(WIKI + encodeURIComponent(q.w.replace(/ /g, '_')))
    .then(r => r.ok ? r.json() : null)
    .then(j => {
      if(!j) return;
      let src = '';
      if(j.originalimage && j.originalimage.width <= 1400) src = j.originalimage.source;
      else if(j.thumbnail) src = j.thumbnail.source.replace(/\/\d+px-/, '/960px-');
      if(!src) return;
      const im = new Image();
      im.onload = () => { q.img = src; if(H && H.phase === 'question' && H.qs[H.i] === q) render(); };
      im.src = src;
    }).catch(() => {});
}

/* Avoid repeating questions across games on the same TV */
function pickQuestions(n){
  let used = [];
  try{ used = JSON.parse(store('gtd-used') || '[]'); }catch(e){}
  let fresh = QUESTIONS.filter(q => !used.includes(q.q));
  if(fresh.length < n){ used = []; fresh = QUESTIONS.slice(); }
  const qs = shuffle(fresh).slice(0, n);
  store('gtd-used', JSON.stringify(used.concat(qs.map(q => q.q))));
  return qs;
}

function startGame(){
  H.qs = pickQuestions(H.rounds);
  H.qs.forEach(loadImage);
  H.players.forEach(p => { p.score = 0; p.last = null; });
  H.i = -1; nextQ();
}
function nextQ(){
  H.i++;
  if(H.i >= H.qs.length){ H.phase = 'end'; broadcast(); render(); return; }
  H.phase = 'question'; H.token++;
  H.deadline = Date.now() + ROUND_MS;
  H.players.forEach(p => p.guess = null);
  const a = H.qs[H.i].a, tok = H.token;
  H.players.filter(p => p.bot).forEach(p => setTimeout(() => {
    if(H.token !== tok || H.phase !== 'question') return;
    p.guess = a + Math.round((Math.random() + Math.random() + Math.random() - 1.5) * 30);
    render(); checkAll();
  }, 1500 + Math.random()*7500));
  clearInterval(H.tick);
  H.tick = setInterval(tickHost, 100);
  broadcast(); render(); tickHost();
}
function tickHost(){
  if(H.phase !== 'question'){ clearInterval(H.tick); return; }
  const left = Math.max(0, H.deadline - Date.now()), low = left <= 3000;
  const t = $('#tleft'); if(t){ t.textContent = Math.ceil(left/1000); t.classList.toggle('low', low); }
  const b = $('#tbar'); if(b){ b.style.width = (left/ROUND_MS*100) + '%'; b.parentNode.classList.toggle('low', low); }
  if(Date.now() > H.deadline + GRACE_MS) reveal();
}
function checkAll(){
  if(H.phase !== 'question') return;
  const ps = active();
  if(ps.length && ps.every(p => p.guess !== null)){ const tok = H.token; setTimeout(() => { if(H.token === tok && H.phase === 'question') reveal(); }, 900); }
}
const pointsFor = d => d === 0 ? 100 : d <= 2 ? 70 : d <= 5 ? 50 : d <= 10 ? 30 : d <= 25 ? 10 : 0;
function reveal(){
  if(H.phase !== 'question') return;
  clearInterval(H.tick);
  const a = H.qs[H.i].a;
  const guessers = H.players.filter(p => p.guess !== null);
  const best = guessers.length ? Math.min(...guessers.map(p => Math.abs(p.guess - a))) : null;
  H.players.forEach(p => {
    p.prev = p.score;
    if(p.guess === null){ p.last = {guess:null, pts:0, bonus:0}; return; }
    const diff = Math.abs(p.guess - a), pts = pointsFor(diff), bonus = (guessers.length > 1 && diff === best) ? 20 : 0;
    p.last = {guess:p.guess, diff, pts, bonus};
    p.score += pts + bonus;
  });
  H.phase = 'reveal'; H.token++;
  broadcast(); render();
}
function backToLobby(){ H.phase = 'lobby'; H.players.forEach(p => { p.score = 0; p.last = null; p.guess = null; }); broadcast(); render(); }

/* Scores column, shown on question and reveal screens */
function scoreSide(mode, delay){
  const key = p => mode === 'r' ? p.prev : p.score;
  const rows = [...H.players].sort((a,b) => key(b) - key(a)).map(p => {
    const on = p.bot || p.online;
    if(mode === 'q'){
      const done = p.guess !== null;
      return `<div class="srow ${on ? '' : 'off'} ${done ? 'done' : ''}" style="--c:${p.color}"><span class="n">${esc(p.name)}</span><span class="st">${done ? '✓' : on ? '…' : '—'}</span><span class="s">${p.score}</span></div>`;
    }
    const gain = p.last ? p.last.pts + p.last.bonus : 0;
    return `<div class="srow ${on ? '' : 'off'}" style="--c:${p.color}"><span class="n">${esc(p.name)}</span><span class="st late" style="animation-delay:${delay}s">${gain ? '+' + gain : ''}${p.last && p.last.bonus ? '★' : ''}</span><span class="s">${p.prev}<span class="new late" style="animation-delay:${delay}s">${p.score}</span></span></div>`;
  }).join('');
  return `<div class="side"><h3>Scores</h3>${rows}</div>`;
}

function render(){
  if(!H) return;
  if(H.phase === 'lobby'){
    const local = location.protocol === 'file:';
    paint(`<div class="screen">
      <div style="text-align:center"><h1 class="title">Guess the Date</h1><div class="rule"></div></div>
      <div class="lobby">
        <div>
          <p class="sub">Scan to join, or open this page on your phone and enter:</p>
          <div class="code">${H.status ? '····' : H.code}</div>
          <p class="msg">${esc(H.status)}${local ? ' This page needs to be hosted online for phones to join.' : ''}</p>
          <div class="qr" id="qr"></div>
        </div>
        <div>
          <p class="sub">Players (${H.players.length}/8)</p>
          <div class="players" style="margin:2vh 0 4vh">${H.players.map(p => `<div class="chip" style="--c:${p.color}"><span class="dot" style="--c:${p.color}"></span>${esc(p.name)}</div>`).join('') || '<span class="sub">Nobody yet…</span>'}</div>
          <p class="sub">Rounds · ${ROUND_MS/1000} seconds to answer each one</p>
          <div class="row" style="justify-content:flex-start;margin:1.5vh 0 4vh">
            ${[5,10,15].map(n => `<button class="btn small ${H.rounds===n?'primary':''}" id="r${n}" onclick="setRounds(${n})">${n}</button>`).join('')}
          </div>
          <div class="row" style="justify-content:flex-start">
            <button class="btn primary" id="b-start" data-auto onclick="startGame()" ${active().length ? '' : 'disabled'}>Start game</button>
            <button class="btn" id="b-bot" onclick="addBot()">Add test player</button>
            ${H.players.some(p => p.bot) ? '<button class="btn" id="b-clr" onclick="clearBots()">Clear test players</button>' : ''}
          </div>
        </div>
      </div></div>`);
    if(!H.status && window.QRCode) new QRCode($('#qr'), {text:joinURL(), width:256, height:256, colorDark:'#3a2816', colorLight:'#fffaf0', correctLevel:QRCode.CorrectLevel.M});
    else $('#qr').style.display = 'none';
  }
  else if(H.phase === 'question'){
    const q = H.qs[H.i];
    const left = Math.max(0, H.deadline - Date.now()), low = left <= 3000;
    paint(`<div class="screen">
      <div class="top"><span>Question ${H.i+1} of ${H.qs.length}</span><span class="tag">${esc(q.c)}</span><span class="tleft ${low ? 'low' : ''}" id="tleft">${Math.ceil(left/1000)}</span></div>
      <div class="timer ${low ? 'low' : ''}"><i id="tbar" style="width:${left/ROUND_MS*100}%"></i></div>
      <div class="main">
        <div class="left">
          ${q.img ? `<div class="frame"><img src="${esc(q.img)}" alt=""></div>` : ''}
          <h2 class="question ${q.img ? 'withimg' : ''}">${esc(q.q)}</h2>
          <button class="btn" id="b-rev" data-auto onclick="reveal()" ${H.players.some(p => p.guess !== null) ? '' : 'disabled'}>Reveal now</button>
        </div>
        ${scoreSide('q')}
      </div>
    </div>`);
  }
  else if(H.phase === 'reveal'){
    const q = H.qs[H.i];
    const g = H.players.filter(p => p.last && p.last.guess !== null).sort((a,b) => a.last.guess - b.last.guess);
    const ys = g.map(p => p.last.guess).concat(q.a);
    let lo = Math.min(...ys), hi = Math.max(...ys);
    const pad = Math.max(4, (hi - lo) * 0.1); lo -= pad; hi += pad;
    const pos = y => ((y - lo) / (hi - lo) * 100).toFixed(2);
    const t = g.length * 0.3 + 0.6;
    const pins = g.map((p,i) => `<div class="pin" style="left:${pos(p.last.guess)}%;--row:${i % 4};--c:${p.color};animation-delay:${i*0.3}s"><div class="lab">${esc(p.name)}<small>${p.last.guess}</small></div><div class="stem"></div></div>`).join('');
    const last = H.i + 1 >= H.qs.length;
    paint(`<div class="screen">
      <div class="top"><span>Question ${H.i+1} of ${H.qs.length}</span><span class="tag">${esc(q.c)}</span><span>Room ${H.code}</span></div>
      <div class="main">
        <div class="left" style="justify-content:space-between">
          <h2 class="revq">${esc(q.q)}</h2>
          <div class="tl"><div class="axis"><b style="left:0"></b><b style="right:0"></b><span style="left:0">${Math.round(lo)}</span><span style="left:100%">${Math.round(hi)}</span></div>
            ${pins}<div class="answer" style="left:${pos(q.a)}%;animation-delay:${t}s"><div class="stem"></div><div class="lab">${q.a}</div></div></div>
          <p class="fact late" style="animation-delay:${t+0.6}s">${esc(q.f)}</p>
          <button class="btn primary late" style="animation-delay:${t+0.9}s" id="b-next" data-auto onclick="nextQ()">${last ? 'Final scores' : 'Next question'}</button>
        </div>
        ${scoreSide('r', t + 0.4)}
      </div>
    </div>`);
  }
  else if(H.phase === 'end'){
    const ranked = [...H.players].sort((a,b) => b.score - a.score);
    paint(`<div class="screen center">
      <h1 class="title">Final Scores</h1><div class="rule"></div>
      <div class="board">${ranked.map((p,i) => `<div class="line" style="--c:${p.color}"><span>${i===0?'🏆':i+1}</span><span class="n">${esc(p.name)}</span><b>${p.score}</b></div>`).join('')}</div>
      <div class="row"><button class="btn primary" id="b-again" data-auto onclick="backToLobby()">Play again</button></div>
    </div>`);
  }
}

/* =================== PLAYER (phone) =================== */
let P = null;
function phoneJoin(code){
  P = {code:String(code || '').toUpperCase().slice(0,4), name:store('gtd-name') || '', phase:'join', year:START_YEAR, msg:''};
  renderPhone();
}
function joinFromForm(){
  const code = $('#code').value.trim().toUpperCase(), name = $('#name').value.trim().slice(0, 14);
  if(code.length !== 4 || !name){ P.msg = 'Enter the 4-letter code and your name.'; P.code = code; P.name = name; renderPhone(); return; }
  store('gtd-name', name);
  connect(code, name);
}
function connect(code, name){
  P.code = code; P.name = name; P.phase = 'connecting'; P.msg = ''; renderPhone();
  if(P.peer) try{ P.peer.destroy(); }catch(e){}
  P.peer = new Peer();
  P.peer.on('open', () => {
    const c = P.peer.connect(PREFIX + code.toLowerCase(), {reliable:true});
    P.conn = c;
    c.on('open', () => c.send({t:'join', name}));
    c.on('data', onPhoneData);
    c.on('close', () => { if(P.phase !== 'join'){ P.phase = 'lost'; renderPhone(); } });
  });
  P.peer.on('error', e => {
    P.phase = 'join';
    P.msg = e.type === 'peer-unavailable' ? 'No game found with that code.' : 'Connection problem (' + e.type + '). Try again.';
    renderPhone();
  });
}
function onPhoneData(d){
  if(d.t === 'hello'){ P.name = d.name; P.color = d.color; return; }
  clearInterval(P.tick);
  if(d.t === 'wait'){ P.phase = 'wait'; P.msg = d.msg; }
  else if(d.t === 'q'){
    P.phase = 'q'; P.q = d; P.locked = d.locked; P.touched = false; P.timeUp = false;
    P.deadline = Date.now() + d.ms;
    try{ navigator.vibrate && navigator.vibrate(60); }catch(e){}
    P.tick = setInterval(tickPhone, 100);
  }
  else if(d.t === 'res'){ P.phase = 'res'; P.res = d; }
  else if(d.t === 'end'){ P.phase = 'end'; P.end = d; }
  else if(d.t === 'err'){ P.phase = 'join'; P.msg = d.msg; }
  renderPhone();
}
function tickPhone(){
  if(P.phase !== 'q'){ clearInterval(P.tick); return; }
  const left = Math.max(0, P.deadline - Date.now()), low = left <= 3000;
  const c = $('#pcd'); if(c){ c.textContent = Math.ceil(left/1000); c.classList.toggle('low', low); }
  const b = $('#pbar'); if(b){ b.style.width = (left/ROUND_MS*100) + '%'; b.parentNode.classList.toggle('low', low); }
  if(left <= 0){
    clearInterval(P.tick);
    if(P.locked == null){ if(P.touched) lockIn(); else { P.timeUp = true; renderPhone(); } }
  }
}
function setYear(y){
  P.touched = true;
  P.year = Math.max(MIN_YEAR, Math.min(MAX_YEAR, Math.round(y)));
  const el = $('#yr'); if(el) el.textContent = P.year;
  const sl = $('#sl'); if(sl && +sl.value !== P.year) sl.value = P.year;
}
function lockIn(){ if(P.locked != null || P.timeUp) return; P.locked = P.year; P.conn && P.conn.open && P.conn.send({t:'guess', year:P.year}); renderPhone(); }

function renderPhone(){
  const who = P.color ? `<div class="sub"><span class="dot" style="--c:${P.color}"></span>${esc(P.name)}</div>` : '';
  let h = '';
  if(P.phase === 'join'){
    h = `<div class="screen center"><h1 class="title">Guess the Date</h1><div class="rule"></div>
      <div><label for="code">Room code</label><input id="code" maxlength="4" autocapitalize="characters" autocomplete="off" value="${esc(P.code)}" style="text-transform:uppercase;letter-spacing:.3em;text-align:center;font-size:1.8rem"></div>
      <div><label for="name">Your name</label><input id="name" maxlength="14" autocomplete="nickname" value="${esc(P.name)}"></div>
      <p class="msg">${esc(P.msg)}</p>
      <button class="btn primary big" onclick="joinFromForm()">Join game</button></div>`;
  }
  else if(P.phase === 'connecting') h = `<div class="screen center"><p class="sub">Joining room ${esc(P.code)}…</p></div>`;
  else if(P.phase === 'lost') h = `<div class="screen center"><p class="sub">Lost connection to the TV.</p><button class="btn primary big" onclick="connect(P.code,P.name)">Rejoin</button></div>`;
  else if(P.phase === 'wait') h = `<div class="screen center">${who}<h2 style="font-family:var(--display);font-weight:normal">${esc(P.msg)}</h2></div>`;
  else if(P.phase === 'q'){
    const q = P.q, left = Math.max(0, P.deadline - Date.now());
    const bar = `<div class="ptop"><div class="timer"><i id="pbar" style="width:${left/ROUND_MS*100}%"></i></div><span class="pcd" id="pcd">${Math.ceil(left/1000)}</span></div>`;
    if(P.timeUp) h = `<div class="screen center">${who}<h1 class="title">Time’s up!</h1><p class="sub">Move the slider sooner next time. Eyes on the TV!</p></div>`;
    else if(P.locked != null) h = `<div class="screen center">${who}<p class="sub">Question ${q.n} of ${q.total}</p><p>${esc(q.text)}</p><div class="yr">${P.locked}</div><p class="sub">Locked in. Eyes on the TV!</p></div>`;
    else h = `<div class="screen">${who}${bar}<div class="card"><span class="tag">${esc(q.cat)}</span><p style="margin:10px 0 0;font-size:1.3rem">${esc(q.text)}</p></div>
      <div class="yr" id="yr">${P.year}</div>
      <input type="range" id="sl" min="${MIN_YEAR}" max="${MAX_YEAR}" step="1" value="${P.year}" oninput="setYear(+this.value)">
      <div class="steps"><button class="btn" onclick="setYear(P.year-10)">−10</button><button class="btn" onclick="setYear(P.year-1)">−1</button><button class="btn" onclick="setYear(P.year+1)">+1</button><button class="btn" onclick="setYear(P.year+10)">+10</button></div>
      <button class="btn primary big" onclick="lockIn()">Lock in</button></div>`;
  }
  else if(P.phase === 'res'){
    const r = P.res, off = r.guess === null ? 'You didn’t guess this time.' : r.guess === r.answer ? 'Exactly right!' : `You said ${r.guess}: ${Math.abs(r.guess - r.answer)} years off.`;
    h = `<div class="screen center">${who}<p class="sub">The answer was</p><div class="yr">${r.answer}</div><p>${off}</p>
      <h2 style="color:var(--seal);margin:0;font-family:var(--display);font-weight:normal;font-size:2.4rem">+${r.pts + r.bonus}</h2>${r.bonus ? '<p class="sub">including +20 for the closest guess</p>' : ''}<p class="sub">Total: ${r.total}</p>
      <div class="card"><p style="margin:0;font-family:var(--italic);font-style:italic">${esc(r.fact)}</p></div></div>`;
  }
  else if(P.phase === 'end'){
    const e = P.end;
    h = `<div class="screen center">${who}<h1 class="title">${e.rank === 1 ? 'You won! 🏆' : 'You came ' + ordinal(e.rank)}</h1><p class="sub">${e.score} points · ${e.of} players</p><p class="sub">Waiting for the next game…</p></div>`;
  }
  app.innerHTML = h;
}
const ordinal = n => n + (['th','st','nd','rd'][(n % 100 - 20) % 10] || ['th','st','nd','rd'][n % 100] || 'th');

home();
</script>
