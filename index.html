<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guess the Date</title>
<style>body{margin:0;background:#f1e4c6;color:#3a2816;font-family:Georgia,serif;display:flex;align-items:center;justify-content:center;height:100vh;font-size:1.4rem;font-style:italic}</style>
</head>
<body>
<p>Unrolling the parchment…</p>
<script>
/* Loads the latest game.html straight from the repository, so updates go live
   without a GitHub Pages rebuild. Falls back to the copy published here. */
(function(){
  var src = 'https://raw.githubusercontent.com/Notsofastmatey/guess-the-date/main/game.html?t=' + Math.floor(Date.now() / 60000);
  fetch(src, {cache: 'no-store'})
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.text(); })
    .then(function(html){ document.open(); document.write(html); document.close(); })
    .catch(function(){ location.replace('game.html' + location.search); });
})();
</script>
</body>
</html>
